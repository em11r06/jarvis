name: Geçici inceleme (sherpa-onnx)
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list -R k2-fsa/sherpa-onnx -L 30 --json tagName -q '[.[]|select(.tagName|test("^v[0-9]"))][0].tagName')
          gh release view "$TAG" -R k2-fsa/sherpa-onnx --json assets -q '.assets[].name' | grep -E "\.aar$" > aars.txt
          gh release download "$TAG" -R k2-fsa/sherpa-onnx -p "$(head -1 aars.txt)" -D a
          unzip -l a/*.aar | grep -E "\.so$"
          unzip -o -q a/*.aar classes.jar -d c && unzip -l c/classes.jar | grep -c class
          echo "SONUC TAG=$TAG"; cat aars.txt
