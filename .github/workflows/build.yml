name: APK Derle ve Yayınla

# Her push'ta APK derlenir ve "latest" adlı GitHub Release'e eklenir.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Ücretsiz uyandırma motoru Vosk için küçük İngilizce model (içinde "jarvis" kelimesi var).
      - name: Vosk modelini önbellekten al
        uses: actions/cache@v4
        with:
          path: vosk-model
          key: vosk-model-small-en-us-0.15

      - name: Vosk modelini APK'ya ekle
        run: |
          if [ ! -d vosk-model/vosk-model-small-en-us-0.15 ]; then
            mkdir -p vosk-model
            curl -fsSL -o vosk-model/m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
            unzip -q vosk-model/m.zip -d vosk-model
            rm vosk-model/m.zip
          fi
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-en-us
          cp -r vosk-model/vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          echo "vosk-small-en-us-0.15" > app/src/main/assets/model-en-us/uuid
          echo "jarvis sözlükte geçiyor mu:"; grep -rac "jarvis" app/src/main/assets/model-en-us || true
          du -sh app/src/main/assets/model-en-us

      # Secret yoksa geçici çözüm: depoya girmeyen, sadece Actions önbelleğinde duran sabit bir
      # anahtar. Böylece imza her derlemede aynı kalır. (Kalıcı çözüm: README'deki secret'lar.)
      - name: Geçici imza anahtarını önbellekten al
        uses: actions/cache@v4
        with:
          path: ci-keystore
          key: jarvis-ci-keystore-v2

      # Secret girildiyse kendi sabit imza anahtarını kullan (önerilen).
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "JARVIS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Kendi imza anahtarınız kullanılıyor."
          else
            echo "::warning::KEYSTORE_BASE64 secret yok, önbellekteki geçici anahtar kullanılıyor. README'deki adımlarla secret ekleyin."
            if [ ! -f ci-keystore/ci.jks ]; then
              mkdir -p ci-keystore
              keytool -genkeypair -keystore ci-keystore/ci.jks -storetype PKCS12 -alias jarvis \
                -keyalg RSA -keysize 2048 -validity 10000 -storepass jarvis-ci -keypass jarvis-ci \
                -dname "CN=Jarvis CI, C=TR"
            fi
            echo "JARVIS_KEYSTORE_FILE=$PWD/ci-keystore/ci.jks" >> "$GITHUB_ENV"
            echo "JARVIS_CI_KEY=1" >> "$GITHUB_ENV"
          fi

      - name: APK derle
        env:
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$JARVIS_CI_KEY" = "1" ]; then
            export JARVIS_KEYSTORE_PASSWORD=jarvis-ci JARVIS_KEY_ALIAS=jarvis JARVIS_KEY_PASSWORD=jarvis-ci
          fi
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Jarvis.apk"

      - name: "\"latest\" sürümünü güncelle"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest "$RUNNER_TEMP/Jarvis.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Jarvis (son sürüm #$GITHUB_RUN_NUMBER)" \
            --notes "Otomatik derleme. Commit: ${GITHUB_SHA::7} ($GITHUB_REF_NAME). Telefondan Jarvis.apk dosyasını indirip kurun." \
            --latest
