name: APK Derle ve Yayınla

# Her push'ta APK derlenir ve "latest" adlı GitHub Release'e eklenir.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Ücretsiz uyandırma motoru Vosk için küçük İngilizce model (içinde "jarvis" kelimesi var).
      - name: Vosk modelini önbellekten al
        uses: actions/cache@v4
        with:
          path: vosk-model
          key: vosk-models-en-us-0.15-spk-0.4

      - name: Vosk modelini APK'ya ekle
        run: |
          if [ ! -d vosk-model/vosk-model-small-en-us-0.15 ]; then
            mkdir -p vosk-model
            curl -fsSL -o vosk-model/m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
            unzip -q vosk-model/m.zip -d vosk-model
            rm vosk-model/m.zip
          fi
          # Ses izi modeli: "Sesimi tanıt" özelliği konuşanın kullanıcı olup olmadığını buna bakarak anlar.
          if [ ! -d vosk-model/vosk-model-spk-0.4 ]; then
            mkdir -p vosk-model
            curl -fsSL -o vosk-model/spk.zip https://alphacephei.com/vosk/models/vosk-model-spk-0.4.zip
            unzip -q vosk-model/spk.zip -d vosk-model
            rm vosk-model/spk.zip
          fi
          ls vosk-model
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-spk
          cp -r vosk-model/vosk-model-spk-0.4 app/src/main/assets/model-spk
          echo "vosk-spk-0.4" > app/src/main/assets/model-spk/uuid
          rm -rf app/src/main/assets/model-en-us
          cp -r vosk-model/vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          echo "vosk-small-en-us-0.15" > app/src/main/assets/model-en-us/uuid
          echo "jarvis sözlükte geçiyor mu:"; grep -rac "jarvis" app/src/main/assets/model-en-us || true
          du -sh app/src/main/assets/model-en-us

      # Secret yoksa geçici çözüm: depoya girmeyen, sadece Actions önbelleğinde duran sabit bir
      # anahtar. Böylece imza her derlemede aynı kalır. (Kalıcı çözüm: README'deki secret'lar.)
      - name: Geçici imza anahtarını önbellekten al
        uses: actions/cache@v4
        with:
          path: ci-keystore
          key: jarvis-ci-keystore-v2

      # Secret girildiyse kendi sabit imza anahtarını kullan (önerilen).
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "JARVIS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Kendi imza anahtarınız kullanılıyor."
          else
            echo "::warning::KEYSTORE_BASE64 secret yok, önbellekteki geçici anahtar kullanılıyor. README'deki adımlarla secret ekleyin."
            if [ ! -f ci-keystore/ci.jks ]; then
              mkdir -p ci-keystore
              keytool -genkeypair -keystore ci-keystore/ci.jks -storetype PKCS12 -alias jarvis \
                -keyalg RSA -keysize 2048 -validity 10000 -storepass jarvis-ci -keypass jarvis-ci \
                -dname "CN=Jarvis CI, C=TR"
            fi
            echo "JARVIS_KEYSTORE_FILE=$PWD/ci-keystore/ci.jks" >> "$GITHUB_ENV"
            echo "JARVIS_CI_KEY=1" >> "$GITHUB_ENV"
          fi

      # youtube_ac aracının kullandığı ayrıştırmanın hâlâ çalıştığını kontrol eder (derlemeyi durdurmaz).
      - name: YouTube arama ayrıştırma kontrolü
        continue-on-error: true
        run: |
          curl -sS -m 20 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36" \
            -H "Accept-Language: tr-TR,tr;q=0.9" -H "Cookie: SOCS=CAI; CONSENT=YES+1" \
            "https://www.youtube.com/results?search_query=Tarkan+Kuzu+Kuzu&hl=tr&gl=TR" -o yt.html
          python3 - <<'PY'
          import re
          b = open('yt.html', encoding='utf-8', errors='ignore').read()
          ms = list(re.finditer(r'"videoRenderer":\{"videoId":"([\w-]{11})"', b))
          print("YT_SONUC_SAYISI", len(ms))
          for m in ms[:3]:
              chunk = b[m.start():m.start() + 6000]
              t = re.search(r'"title":\{"runs":\[\{"text":"(.*?)"\}', chunk)
              print("YT_VIDEO", m.group(1), t and t.group(1))
          PY

      # Telefonda çalışan yapay zeka (Gemini Nano / ML Kit GenAI) kütüphane sürümlerini listeler (sonraki adım için bilgi).
      - name: Gemini Nano kütüphane sürümleri
        continue-on-error: true
        run: |
          for a in com/google/mlkit/genai-prompt com/google/mlkit/genai-common com/google/ai/edge/aicore/aicore; do
            echo "== $a"; curl -sS -m 15 "https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml" | grep -oE '<version>[^<]+' | tail -5
          done

      - name: APK derle
        env:
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$JARVIS_CI_KEY" = "1" ]; then
            export JARVIS_KEYSTORE_PASSWORD=jarvis-ci JARVIS_KEY_ALIAS=jarvis JARVIS_KEY_PASSWORD=jarvis-ci
          fi
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Jarvis.apk"

      - name: "\"latest\" sürümünü güncelle"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest "$RUNNER_TEMP/Jarvis.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Jarvis (son sürüm #$GITHUB_RUN_NUMBER)" \
            --notes "$(git log -1 --pretty=%s)

          Sürüm #$GITHUB_RUN_NUMBER, commit ${GITHUB_SHA::7}. Jarvis bu güncellemeyi kendisi indirir; elle kurmak için Jarvis.apk dosyasını indirin." \
            --latest
